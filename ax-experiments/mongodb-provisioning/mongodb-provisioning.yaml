# yaml-language-server: $schema=https://docs.514.ax/schema/experiment.v2.schema.yaml
# Design: docs/mongodb-provisioning/experiment-design.md

schema_version: 2
id: mongodb-provisioning
name: MongoDB provisioning methods
description: |
  Research questions:
  1) Can coding agents provision MongoDB across methods that do not require
     Atlas authentication (Docker, Atlas CLI local, apt, Atlas ephemeral)?
  2) Can they provision a hosted Atlas cluster when authentication is required
     (Atlas CLI cloud; expected to fail)?
  3) How efficiently do they provision by method (platform cost, wall clock,
     turns)?
  Measure: URI-report rate and agent-initiated MongoDB connection verification
  from run evidence; method-constraint so a local URI cannot count as success
  for atlas-cli-cloud or atlas-ephemeral; platform cost/wallClockTime/turns.
  Bet: unauthenticated methods complete ≳95% (agent bet: Docker ≥95%, Atlas
  local ~90%, apt ~85%, ephemeral ~75% and high variance); Atlas cloud ~0%,
  with a substitution tail if grading only checks that a URI works.
  Surface: none (no products or environments axis).
  Docker is platform-provided in every sandbox. Agents must install Atlas CLI
  and OS packages themselves.
  Limitation: AX test sandboxes cannot independently connect to the
  agent-started database. connection-verified-in-agent is agent-initiated
  evidence, not a live post-agent probe. Run-evidence tests fail closed unless
  AX injects ax-run-query with a valid run-scoped query token.

prompts:
  - id: docker
    prompt: |
      Provision me a MongoDB database. Use Docker to provision it.

      Leave it in the running state that accepts connections.

      When you are done verify the database is running with an operation and report back to me the connection URI.
  - id: atlas-ephemeral-naive
    prompt: |
      Provision me a MongoDB database. Use Atlas ephemeral clusters to provision it.

      Leave it in the running state that accepts connections.

      When you are done verify the database is running with an operation and report back to me the connection URI.
  - id: atlas-ephemeral-curl
    prompt: |
      Provision me a MongoDB database. Use Atlas ephemeral clusters to provision it.

      Use this curl command to provision the database:
      ```bash
      curl -sS -X POST 'https://cloud-dev.mongodb.com/api/atlas/v2/unauth/ephemeralClusters:create?pretty=true' \
        -H 'Accept: application/vnd.atlas.preview+json'
      ```

      Leave it in the running state that accepts connections.

      When you are done verify the database is running with an operation and report back to me the connection URI.
  - id: atlas-cli-local
    prompt: |
      Provision me a MongoDB database. Use the Atlas CLI to create an Atlas local deployment.

      Leave it in the running state that accepts connections.

      When you are done verify the database is running with an operation and report back to me the connection URI.
  - id: atlas-cli-cloud
    prompt: |
      Provision me a MongoDB database. Use the Atlas CLI to create a hosted MongoDB Atlas cluster.

      Leave it in the running state that accepts connections.

      When you are done verify the database is running with an operation and report back to me the connection URI.
  - id: local-package-manager
    prompt: |
      Provision me a MongoDB database. Use the native OS package manager to provision it.

      Leave it in the running state that accepts connections.

      When you are done verify the database is running with an operation and report back to me the connection URI.

extensions:
  - id: claude-sonnet
    agents: [claude]
    models: [claude-sonnet-5]
  - id: cursor-grok
    agents: [cursor]
    models: [grok-4.5]
  - id: cursor-sonnet
    agents: [cursor]
    models: [claude-sonnet-5]
  - id: cursor-terra
    agents: [cursor]
    models: [gpt-5.6-terra]
  - id: codex-terra
    agents: [codex]
    models: [gpt-5.6-terra]
  - id: codex-luna
    agents: [codex]
    models: [gpt-5.6-luna]

